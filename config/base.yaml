zotero:
  user_id: ???
  api_key: ???
  include_path: null
  ignore_path: null

source:
  arxiv:
    category:
      - cs.LG
      - cs.CV
      - eess.SY
      - physics.geo-ph
    include_cross_list: false

  openalex:
    lookback_days: 7
    per_page: 50
    tracked_authors: []

    semantic_search: true
    semantic_seed_count: 5
    semantic_per_page: 30
    semantic_types:
      - article

  biorxiv:
    category: null

  medrxiv:
    category: null

  chemrxiv:
    include_new_versions: false

email:
  sender: ???
  receiver: ???
  smtp_server: ???
  smtp_port: ???
  sender_password: ???

llm:
  api:
    key: ???
    base_url: ???
  api_mode: chat_completion
  generation_kwargs:
    max_tokens: 16384
    model: ???
  language: English

reranker:
  local:
    model: jinaai/jina-embeddings-v5-text-nano-retrieval
    encode_kwargs:
      task: retrieval
      prompt_name: document

  api:
    key: null
    base_url: null
    model: null
    batch_size: null

executor:
  debug: false
  send_empty: false
  max_paper_num: 30
  source:
    - arxiv
    - openalex
  reranker: local
